<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الحياة والإنتاجية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --primary: #4a6fa5;
      --accent: #27ae60;
      --danger: #e74c3c;
      --border: #e2e8f0;
    }
    body.dark {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #e9ecef;
      --primary: #0f3460;
      --border: #0f3460;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    button.theme-btn {
      background: none;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .date-picker-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      background: var(--primary);
      color: white;
    }
    .date-picker-card input[type="date"] {
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
      color: #333;
      cursor: pointer;
    }
    .quick-date-btns {
      display: flex;
      gap: 8px;
    }
    .quick-date-btns button {
      background: rgba(255,255,255,0.2);
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
    }
    button.add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }
    li.done span { text-decoration: line-through; opacity: 0.6; }
    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 5px;
    }
    .progress-bar {
      height: 10px;
      background: var(--border);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>منظم الحياة والإنتاجية</h1>
      <button class="theme-btn" onclick="toggleTheme()">🌙 الوضع</button>
    </div>

    <!-- اختيار اليوم والتاريخ -->
    <div class="card date-picker-card">
      <div style="font-size: 1.1rem; font-weight: bold;">📅 اليوم المحدد: <span id="display-date-label"></span></div>
      <input type="date" id="selected-date" onchange="changeDate(this.value)">
      <div class="quick-date-btns">
        <button onclick="setQuickDate(0)">اليوم</button>
        <button onclick="setQuickDate(1)">غداً</button>
      </div>
    </div>

    <!-- نسبة إنجاز اليوم -->
    <div class="card">
      <h3>إنجاز أهداف هذا اليوم: <span id="progress-text">0%</span></h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- قائمة أهداف ومهام اليوم -->
    <div class="card">
      <h3>🎯 أهداف ومهام اليوم</h3>
      <div class="input-group">
        <input type="text" id="task-input" placeholder="أضف هدف أو مهمة لهذا اليوم...">
        <button class="add-btn" onclick="addTask()">إضافة</button>
      </div>
      <ul id="task-list"></ul>
    </div>
  </div>

  <script>
    // الحصول على تاريخ اليوم بتنسيق YYYY-MM-DD
    function getTodayString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }

    let currentDate = getTodayString(0);
    
    // مخزن المهام مقسم بالتاريخ
    let allTasks = JSON.parse(localStorage.getItem('life_app_tasks_by_date')) || {};

    function initDate() {
      const dateInput = document.getElementById('selected-date');
      dateInput.value = currentDate;
      updateDateLabel();
      render();
    }

    function updateDateLabel() {
      const label = document.getElementById('display-date-label');
      const today = getTodayString(0);
      const tomorrow = getTodayString(1);

      if (currentDate === today) {
        label.innerText = `اليوم (${currentDate})`;
      } else if (currentDate === tomorrow) {
        label.innerText = `غداً (${currentDate})`;
      } else {
        label.innerText = currentDate;
      }
    }

    function changeDate(newDate) {
      if (!newDate) return;
      currentDate = newDate;
      updateDateLabel();
      render();
    }

    function setQuickDate(offset) {
      currentDate = getTodayString(offset);
      document.getElementById('selected-date').value = currentDate;
      updateDateLabel();
      render();
    }

    function saveData() {
      localStorage.setItem('life_app_tasks_by_date', JSON.stringify(allTasks));
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim() === '') return;

      if (!allTasks[currentDate]) {
        allTasks[currentDate] = [];
      }

      allTasks[currentDate].push({ text: input.value, done: false });
      input.value = '';
      saveData();
    }

    function toggleTask(index) {
      if (allTasks[currentDate]) {
        allTasks[currentDate][index].done = !allTasks[currentDate][index].done;
        saveData();
      }
    }

    function deleteTask(index) {
      if (allTasks[currentDate]) {
        allTasks[currentDate].splice(index, 1);
        saveData();
      }
    }

    function render() {
      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';

      const dayTasks = allTasks[currentDate] || [];
      let doneCount = 0;

      dayTasks.forEach((task, index) => {
        if (task.done) doneCount++;
        const li = document.createElement('li');
        li.className = task.done ? 'done' : '';
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer">${task.text}</span>
          <div class="actions">
            <button onclick="toggleTask(${index})">${task.done ? '↩️' : '✅'}</button>
            <button onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        taskList.appendChild(li);
      });

      const percent = dayTasks.length === 0 ? 0 : Math.round((doneCount / dayTasks.length) * 100);
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    // بدء التشغيل
    initDate();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
