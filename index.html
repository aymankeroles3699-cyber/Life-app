<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الحياة والإنتاجية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --primary: #4a6fa5;
      --accent: #27ae60;
      --danger: #e74c3c;
      --border: #e2e8f0;
    }
    body.dark {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #e9ecef;
      --primary: #0f3460;
      --border: #0f3460;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    button.theme-btn {
      background: none;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
    }
    button.add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }
    li.done span { text-decoration: line-through; opacity: 0.6; }
    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 5px;
    }
    .progress-bar {
      height: 10px;
      background: var(--border);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>منظم الحياة والإنتاجية</h1>
      <button class="theme-btn" onclick="toggleTheme()">🌙 الوضع</button>
    </div>

    <!-- نسبة الإنجاز -->
    <div class="card">
      <h3>نسبة إنجاز المهام: <span id="progress-text">0%</span></h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- قائمة المهام -->
    <div class="card">
      <h3>قائمة المهام</h3>
      <div class="input-group">
        <input type="text" id="task-input" placeholder="أضف مهمة جديدة...">
        <button class="add-btn" onclick="addTask()">إضافة</button>
      </div>
      <ul id="task-list"></ul>
    </div>

    <!-- تتبع العادات -->
    <div class="card">
      <h3>تتبع العادات اليومية</h3>
      <div class="input-group">
        <input type="text" id="habit-input" placeholder="عادة جديدة (مثل: القراءة)...">
        <button class="add-btn" onclick="addHabit()">إضافة</button>
      </div>
      <ul id="habit-list"></ul>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [];

    function saveData() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      localStorage.setItem('my_habits', JSON.stringify(habits));
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim() === '') return;
      tasks.push({ text: input.value, done: false });
      input.value = '';
      saveData();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      saveData();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveData();
    }

    function addHabit() {
      const input = document.getElementById('habit-input');
      if (input.value.trim() === '') return;
      habits.push({ text: input.value, count: 0 });
      input.value = '';
      saveData();
    }

    function incrementHabit(index) {
      habits[index].count += 1;
      saveData();
    }

    function deleteHabit(index) {
      habits.splice(index, 1);
      saveData();
    }

    function render() {
      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';
      let doneCount = 0;

      tasks.forEach((task, index) => {
        if (task.done) doneCount++;
        const li = document.createElement('li');
        li.className = task.done ? 'done' : '';
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer">${task.text}</span>
          <div class="actions">
            <button onclick="toggleTask(${index})">${task.done ? '↩️' : '✅'}</button>
            <button onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        taskList.appendChild(li);
      });

      // حساب نسبة الإنجاز
      const percent = tasks.length === 0 ? 0 : Math.round((doneCount / tasks.length) * 100);
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const habitList = document.getElementById('habit-list');
      habitList.innerHTML = '';
      habits.forEach((habit, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${habit.text} (تمت: ${habit.count} مرة)</span>
          <div class="actions">
            <button onclick="incrementHabit(${index})">➕</button>
            <button onclick="deleteHabit(${index})">🗑️</button>
          </div>
        `;
        habitList.appendChild(li);
      });
    }

    // التشغيل الأول للتطبيقات
    render();
  </script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
