<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الحياة الشقّي 🔥</title>
  <link rel="manifest" href="manifest.json">
  <!-- مكتبة الاحتفال بالكونفيتي عند إنجاز المهمة -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #2d3748;
      --primary: #6b46c1;
      --accent: #38a169;
      --danger: #e53e3e;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-grad);
      min-height: 100vh;
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    h1 { font-size: 1.5rem; margin: 0; display: flex; align-items: center; gap: 8px; }

    /* حركات وتأثيرات الكروت */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transform: translateY(0);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    /* اختيار التاريخ بشكل جذاب */
    .date-card {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      color: #2d3748;
      text-align: center;
    }

    .date-picker-input {
      border: 2px solid white;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
      outline: none;
    }

    .quick-btns button {
      background: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      color: #764ba2;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .quick-btns button:active {
      transform: scale(0.92);
    }

    /* شريط الإنجاز المتحرك */
    .progress-bar {
      height: 14px;
      background: #edf2f7;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #42e695 0%, #3bb2b8 100%);
      width: 0%;
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* إضافة مهمة جديدة */
    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #764ba2;
    }

    button.add-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button.add-btn:active {
      transform: scale(0.95);
    }

    /* قائمة المهام بالحركات */
    ul { list-style: none; padding: 0; margin: 12px 0 0 0; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f7fafc;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.3s ease;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    li.done {
      background: #e6fffa;
      opacity: 0.8;
    }

    li.done span {
      text-decoration: line-through;
      color: #276749;
    }

    .task-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .task-actions button:active {
      transform: scale(1.3);
    }

    /* صورة تحفيزية مميزة */
    .motivation-banner {
      width: 100%;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🚀 منظم يومي الشقّي</h1>
      <span style="font-size: 1.5rem;">✨</span>
    </div>

    <!-- صورة غلاف تحفيزية شقية -->
    <img src="https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=600&q=80" class="motivation-banner" alt="Motivation">

    <!-- كارت اليوم والتاريخ -->
    <div class="card date-card">
      <h3 style="margin: 0 0 10px 0;">📅 حدد أهدافك لـ: <span id="display-date-label"></span></h3>
      <input type="date" id="selected-date" class="date-picker-input" onchange="changeDate(this.value)">
      <div class="quick-btns" style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
        <button onclick="setQuickDate(0)">🔥 اليوم</button>
        <button onclick="setQuickDate(1)">🚀 غداً</button>
      </div>
    </div>

    <!-- شريط الإنجاز الاحتفالي -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold;">🎯 نسبة إنجاز اليوم:</span>
        <span id="progress-text" style="font-weight: bold; color: #319795;">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div id="encouragement" style="font-size: 0.85rem; color: #718096; margin-top: 6px; text-align: center;">يلا يا بطل ابدأ أنجز أول مهمة! 💪</div>
    </div>

    <!-- قائمة الأهداف والمهام -->
    <div class="card">
      <h3 style="margin:0;">📝 قائمة المهام والتحديات</h3>
      <div class="input-group">
        <input type="text" id="task-input" placeholder="اكتب هدف أو مهمة جديدة هنا...">
        <button class="add-btn" onclick="addTask()">إضافة 🚀</button>
      </div>
      <ul id="task-list"></ul>
    </div>
  </div>

  <script>
    function getTodayString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }

    let currentDate = getTodayString(0);
    let allTasks = JSON.parse(localStorage.getItem('life_app_tasks_by_date')) || {};

    function initDate() {
      document.getElementById('selected-date').value = currentDate;
      updateDateLabel();
      render();
    }

    function updateDateLabel() {
      const label = document.getElementById('display-date-label');
      const today = getTodayString(0);
      const tomorrow = getTodayString(1);

      if (currentDate === today) label.innerText = `اليوم 🎉`;
      else if (currentDate === tomorrow) label.innerText = `غداً 🚀`;
      else label.innerText = currentDate;
    }

    function changeDate(newDate) {
      if (!newDate) return;
      currentDate = newDate;
      updateDateLabel();
      render();
    }

    function setQuickDate(offset) {
      currentDate = getTodayString(offset);
      document.getElementById('selected-date').value = currentDate;
      updateDateLabel();
      render();
    }

    function saveData() {
      localStorage.setItem('life_app_tasks_by_date', JSON.stringify(allTasks));
      render();
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim() === '') return;

      if (!allTasks[currentDate]) allTasks[currentDate] = [];
      allTasks[currentDate].push({ text: input.value, done: false });
      input.value = '';
      saveData();
    }

    function toggleTask(index) {
      if (allTasks[currentDate]) {
        const isDoneNow = !allTasks[currentDate][index].done;
        allTasks[currentDate][index].done = isDoneNow;

        // إطلاق احتفال مفرقعات الألوان عند إتمام المهمة! 🎉
        if (isDoneNow) {
          confetti({
            particleCount: 70,
            spread: 60,
            origin: { y: 0.7 }
          });
        }
        saveData();
      }
    }

    function deleteTask(index) {
      if (allTasks[currentDate]) {
        allTasks[currentDate].splice(index, 1);
        saveData();
      }
    }

    function render() {
      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';

      const dayTasks = allTasks[currentDate] || [];
      let doneCount = 0;

      dayTasks.forEach((task, index) => {
        if (task.done) doneCount++;
        const li = document.createElement('li');
        li.className = task.done ? 'done' : '';
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.text}</span>
          <div class="task-actions">
            <button onclick="toggleTask(${index})">${task.done ? '↩️' : '✅'}</button>
            <button onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        taskList.appendChild(li);
      });

      const percent = dayTasks.length === 0 ? 0 : Math.round((doneCount / dayTasks.length) * 100);
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      // رسائل تحفيزية متغيرة بحسب نسبة الإنجاز
      const enc = document.getElementById('encouragement');
      if (percent === 0) enc.innerText = "يلا يا بطل ابدأ أنجز أول مهمة! 💪";
      else if (percent < 50) enc.innerText = "بداية ممتازة.. كمل يا وحش! 🔥";
      else if (percent < 100) enc.innerText = "عديت النص! هانت جداً 🚀";
      else enc.innerText = "عاش يا بطل! قفلت مهام اليوم بنجاح 🏆🎉";
    }

    initDate();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
