<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الأهداف والإنتاجية</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .motivation-banner {
      width: 100%;
      height: 140px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }

    .date-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(30, 41, 59, 0.9));
      text-align: center;
    }

    .date-picker-input {
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      outline: none;
      width: 80%;
      text-align: center;
      margin-bottom: 10px;
    }

    .quick-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .quick-btns button {
      background: var(--primary);
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    .quick-btns button:hover {
      background: var(--primary-hover);
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      outline: none;
    }

    button.add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    ul { list-style: none; padding: 0; margin: 12px 0 0 0; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    li.done {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }

    li.done span {
      text-decoration: line-through;
      color: var(--subtext);
    }

    .task-actions button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 4px;
    }

    /* كارت التقارير والإحصائيات */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- صورة غلاف أنيقة بدون العنوان العلوي -->
    <img src="https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=600&q=80" class="motivation-banner" alt="Gains">

    <!-- اختيار التاريخ -->
    <div class="card date-card">
      <h3 style="margin: 0 0 10px 0; color: var(--text);">📅 أهداف يوم: <span id="display-date-label"></span></h3>
      <input type="date" id="selected-date" class="date-picker-input" onchange="changeDate(this.value)">
      <div class="quick-btns">
        <button onclick="setQuickDate(0)">اليوم</button>
        <button onclick="setQuickDate(1)">غداً</button>
      </div>
    </div>

    <!-- نسبة إنجاز اليوم -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold;">🎯 إنجاز اليوم الحالي:</span>
        <span id="progress-text" style="font-weight: bold; color: var(--accent);">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div id="encouragement" style="font-size: 0.85rem; color: var(--subtext); margin-top: 8px; text-align: center;">ابدأ أنجز أهدافك اليوم! 💪</div>
    </div>

    <!-- قائمة المهام -->
    <div class="card">
      <h3 style="margin:0;">📝 قائمة المهام والأهداف</h3>
      <div class="input-group">
        <input type="text" id="task-input" placeholder="اكتب هدفك هنا...">
        <button class="add-btn" onclick="addTask()">إضافة</button>
      </div>
      <ul id="task-list"></ul>
    </div>

    <!-- تقرير الإنجاز والتاريخ الشامل -->
    <div class="card">
      <h3 style="margin: 0 0 8px 0;">📊 تقرير الإنجاز الشامل</h3>
      <div class="stats-grid">
        <div class="stat-box">
          <div style="font-size:0.8rem; color:var(--subtext);">الأهداف المكتملة</div>
          <div class="stat-number" id="total-completed-tasks">0</div>
        </div>
        <div class="stat-box">
          <div style="font-size:0.8rem; color:var(--subtext);">نسبة النجاح العامة</div>
          <div class="stat-number" id="overall-success-rate">0%</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function getTodayString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }

    let currentDate = getTodayString(0);
    let allTasks = JSON.parse(localStorage.getItem('life_app_tasks_by_date')) || {};

    function initDate() {
      document.getElementById('selected-date').value = currentDate;
      updateDateLabel();
      render();
    }

    function updateDateLabel() {
      const label = document.getElementById('display-date-label');
      const today = getTodayString(0);
      const tomorrow = getTodayString(1);

      if (currentDate === today) label.innerText = `اليوم (${currentDate})`;
      else if (currentDate === tomorrow) label.innerText = `غداً (${currentDate})`;
      else label.innerText = currentDate;
    }

    function changeDate(newDate) {
      if (!newDate) return;
      currentDate = newDate;
      updateDateLabel();
      render();
    }

    function setQuickDate(offset) {
      currentDate = getTodayString(offset);
      document.getElementById('selected-date').value = currentDate;
      updateDateLabel();
      render();
    }

    function saveData() {
      localStorage.setItem('life_app_tasks_by_date', JSON.stringify(allTasks));
      render();
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim() === '') return;

      if (!allTasks[currentDate]) allTasks[currentDate] = [];
      allTasks[currentDate].push({ text: input.value, done: false });
      input.value = '';
      saveData();
    }

    function toggleTask(index) {
      if (allTasks[currentDate]) {
        const isDone = !allTasks[currentDate][index].done;
        allTasks[currentDate][index].done = isDone;

        if (isDone) {
          confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
        }
        saveData();
      }
    }

    function deleteTask(index) {
      if (allTasks[currentDate]) {
        allTasks[currentDate].splice(index, 1);
        saveData();
      }
    }

    function updateOverallReport() {
      let total = 0;
      let completed = 0;

      Object.keys(allTasks).forEach(date => {
        allTasks[date].forEach(task => {
          total++;
          if (task.done) completed++;
        });
      });

      document.getElementById('total-completed-tasks').innerText = completed;
      const overallPercent = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('overall-success-rate').innerText = `${overallPercent}%`;
    }

    function render() {
      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';

      const dayTasks = allTasks[currentDate] || [];
      let doneCount = 0;

      dayTasks.forEach((task, index) => {
        if (task.done) doneCount++;
        const li = document.createElement('li');
        li.className = task.done ? 'done' : '';
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.text}</span>
          <div class="task-actions">
            <button onclick="toggleTask(${index})">${task.done ? '↩️' : '✅'}</button>
            <button onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        taskList.appendChild(li);
      });

      const percent = dayTasks.length === 0 ? 0 : Math.round((doneCount / dayTasks.length) * 100);
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const enc = document.getElementById('encouragement');
      if (percent === 0) enc.innerText = "ابدأ أنجز أهدافك اليوم! 💪";
      else if (percent < 100) enc.innerText = "استمر، أنت قريب من الهدف! 🔥";
      else enc.innerText = "أحسنت! أتممت جميع أهداف اليوم 🏆";

      updateOverallReport();
    }

    initDate();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
