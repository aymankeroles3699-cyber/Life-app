<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الأهداف والإنتاجية</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      color: var(--text);
      margin: 0;
      padding: 16px 16px 80px 16px;
      box-sizing: border-box;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* الشاشات والتنقل */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .motivation-banner {
      width: 100%;
      height: 130px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }

    .date-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(30, 41, 59, 0.9));
      text-align: center;
    }

    .date-picker-input {
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      outline: none;
      width: 80%;
      text-align: center;
      margin-bottom: 10px;
    }

    .quick-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .quick-btns button {
      background: var(--primary);
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      outline: none;
    }

    button.add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    ul { list-style: none; padding: 0; margin: 12px 0 0 0; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    li.done {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }

    li.done span {
      text-decoration: line-through;
      color: var(--subtext);
    }

    .task-actions button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 4px;
    }

    /* شريط التنقل السفلي Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--subtext);
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      background: none;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.3rem;
    }

    /* تصميم كروت التقرير للسجل */
    .history-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
    }

    .badge.full {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
    }

    .history-task-list {
      font-size: 0.85rem;
      color: var(--subtext);
      padding-right: 18px;
      margin: 6px 0 0 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- الشاشة الأولى: أهداف اليوم -->
    <div id="tab-today" class="tab-content active">
      <img src="https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=600&q=80" class="motivation-banner" alt="Cover">

      <div class="card date-card">
        <h3 style="margin: 0 0 10px 0; color: var(--text);">📅 أهداف يوم: <span id="display-date-label"></span></h3>
        <input type="date" id="selected-date" class="date-picker-input" onchange="changeDate(this.value)">
        <div class="quick-btns">
          <button onclick="setQuickDate(0)">اليوم</button>
          <button onclick="setQuickDate(1)">غداً</button>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: bold;">🎯 إنجاز هذا اليوم:</span>
          <span id="progress-text" style="font-weight: bold; color: var(--accent);">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="encouragement" style="font-size: 0.85rem; color: var(--subtext); margin-top: 8px; text-align: center;">ابدأ أنجز أهدافك اليوم! 💪</div>
      </div>

      <div class="card">
        <h3 style="margin:0;">📝 قائمة المهام والأهداف</h3>
        <div class="input-group">
          <input type="text" id="task-input" placeholder="اكتب هدفك هنا...">
          <button class="add-btn" onclick="addTask()">إضافة</button>
        </div>
        <ul id="task-list"></ul>
      </div>
    </div>

    <!-- الشاشة الثانية: التقرير والسجل التاريخي -->
    <div id="tab-reports" class="tab-content">
      <div class="card">
        <h2 style="margin:0 0 6px 0;">📊 تقرير سجل الأيام</h2>
        <p style="color:var(--subtext); font-size:0.85rem; margin:0 0 16px 0;">متابعة الأهداف ونسب الإنجاز لجميع الأيام المسجلة.</p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
          <div style="flex:1; background:rgba(15,23,42,0.6); padding:12px; border-radius:12px; text-align:center; border:1px solid var(--card-border);">
            <div style="font-size:0.8rem; color:var(--subtext);">إجمالي الأيام</div>
            <div id="total-days-count" style="font-size:1.3rem; font-weight:bold; color:var(--primary);">0</div>
          </div>
          <div style="flex:1; background:rgba(15,23,42,0.6); padding:12px; border-radius:12px; text-align:center; border:1px solid var(--card-border);">
            <div style="font-size:0.8rem; color:var(--subtext);">نسبة الإنجاز الكلية</div>
            <div id="total-success-rate" style="font-size:1.3rem; font-weight:bold; color:var(--accent);">0%</div>
          </div>
        </div>

        <div id="history-container">
          <!-- سيتم توليد كروت الأيام السابقة هنا تلقائياً -->
        </div>
      </div>
    </div>

  </div>

  <!-- شريط التنقل السفلي -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('today', this)">
      <span class="nav-icon">🎯</span>
      <span>اليوم</span>
    </button>
    <button class="nav-item" onclick="switchTab('reports', this)">
      <span class="nav-icon">📊</span>
      <span>التقارير والسجل</span>
    </button>
  </div>

  <script>
    function getLocalDateString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let currentDate = getLocalDateString(0);
    let allTasks = JSON.parse(localStorage.getItem('life_app_tasks_by_date')) || {};

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`tabتطوير التنقل بين الشاشات مع إضافة صفحة تقرير كاملة للأيام السابقة هو الخيار الأفضل لتنظيم التطبيق.

سنقوم بتحويل الواجهة إلى نظام **شاشات تنقل سفلية (Bottom Navigation Bar)** مثل التطبيقات الاحترافية:
* **الشاشة الأولى (🎯 اليوم):** لإضافة وتتبع أهداف اليوم المحدد والتفاعل معها.
* **الشاشة الثانية (📊 التقارير):** تحتوي على سجّل كامل لكل الأيام السابقة التي أضفت فيها أهدافاً، وتعرض لك نسبة إنجاز كل يوم بالتفصيل، بالإضافة إلى الإحصائيات العامة.
